services:
  backlog-tracker:
    build: .
    container_name: game_backlog_tracker
    ports:
      - "5000:5000"
    volumes:
      - backlog_data:/app/data
    environment:
      - DB_PATH=/app/data/backlog.db
      - TMDB_API_KEY=${TMDB_API_KEY}
      - USERSCRIPT_API_SECRET=${USERSCRIPT_API_SECRET}
    env_file:
      - .env
    restart: unless-stopped

volumes:
  backlog_data: